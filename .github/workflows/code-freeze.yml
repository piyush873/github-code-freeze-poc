name: Code Freeze POC

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  administration: read

jobs:
  code-freeze-check:
    runs-on: ubuntu-latest

    env:
      RELEASE_DATE: "2026-08-31"
      FREEZE_DAYS: 21

    steps:
      - name: Check Code Freeze
        run: |
          echo "Release Date: $RELEASE_DATE"
          echo "Freeze Period: $FREEZE_DAYS days"

          RELEASE_TS=$(date -d "$RELEASE_DATE" +%s)
          TODAY_TS=$(date -u +%s)

          FREEZE_TS=$((RELEASE_TS - FREEZE_DAYS * 86400))

          FREEZE_DATE=$(date -u -d "@$FREEZE_TS" "+%Y-%m-%d")

          echo "Today's Date: $(date -u "+%Y-%m-%d")"
          echo "Calculated Freeze Date: $FREEZE_DATE"

          if [ "$(date -u "+%Y-%m-%d")" = "$FREEZE_DATE" ]; then
            echo "🚨 CODE FREEZE SHOULD START TODAY"
          else
            echo "✅ Code Freeze is not required today"
          fi

      - name: Check GitHub Branch Protection
        if: success()
        run: |
          echo "Checking branch protection for main..."

          RESPONSE=$(curl -s \
            -o /tmp/protection.json \
            -w "%{http_code}" \
            -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/branches/main/protection")

          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            echo "Branch protection is enabled."
            cat /tmp/protection.json
          elif [ "$RESPONSE" = "404" ]; then
            echo "Branch protection is not enabled for main."
          else
            echo "GitHub API request failed."
            cat /tmp/protection.json
            exit 1
          fi