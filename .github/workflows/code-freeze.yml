name: Code Freeze POC

on:
  workflow_dispatch:
    inputs:
      release_completed:
        description: "Simulate release completion for testing"
        required: true
        type: boolean
        default: false

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  issues: write

jobs:
  code-freeze-check:
    runs-on: ubuntu-latest

    env:
      RELEASE_DATE: "2026-08-31"
      FREEZE_DAYS: 21

    steps:

      # ==========================================================
      # 1. Check whether today is inside the Code Freeze period
      # ==========================================================
      - name: Check Code Freeze
        id: freeze-check
        run: |
          echo "Release Date: $RELEASE_DATE"
          echo "Freeze Period: $FREEZE_DAYS days"

          RELEASE_TS=$(date -d "$RELEASE_DATE" +%s)

          FREEZE_TS=$((RELEASE_TS - FREEZE_DAYS * 86400))
          FREEZE_DATE=$(date -u -d "@$FREEZE_TS" "+%Y-%m-%d")
          TODAY=$(date -u "+%Y-%m-%d")

          echo "Today's Date: $TODAY"
          echo "Calculated Freeze Date: $FREEZE_DATE"

          # Make Freeze Date available to later steps
          echo "freeze_date=$FREEZE_DATE" >> "$GITHUB_OUTPUT"

          # Freeze is active from Freeze Date until Release Date
          if [[ "$TODAY" > "$FREEZE_DATE" || "$TODAY" == "$FREEZE_DATE" ]] && \
             [[ "$TODAY" < "$RELEASE_DATE" ]]; then

            echo "🚨 CODE FREEZE IS ACTIVE"
            echo "freeze=true" >> "$GITHUB_OUTPUT"
            echo "Freeze output: true"

          else

            echo "✅ Code Freeze is not active today"
            echo "freeze=false" >> "$GITHUB_OUTPUT"
            echo "Freeze output: false"

          fi


      # ==========================================================
      # 2. Check whether the release is completed
      #
      # Scheduled workflow:
      #   Uses RELEASE_DATE automatically.
      #
      # Manual workflow:
      #   release_completed=true can be used to simulate
      #   release completion for POC testing.
      # ==========================================================
      - name: Check Release Completion
        id: release-check
        run: |
          TODAY=$(date -u "+%Y-%m-%d")

          echo "Today's Date: $TODAY"
          echo "Release Date: $RELEASE_DATE"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.release_completed }}" = "true" ]; then

            echo "🧪 Manual test: Release completion simulated."
            echo "release_completed=true" >> "$GITHUB_OUTPUT"

          elif [[ "$TODAY" > "$RELEASE_DATE" || "$TODAY" == "$RELEASE_DATE" ]]; then

            echo "🚀 Release date has been reached."
            echo "release_completed=true" >> "$GITHUB_OUTPUT"

          else

            echo "⏳ Release is not completed yet."
            echo "release_completed=false" >> "$GITHUB_OUTPUT"

          fi


      # ==========================================================
      # 3. Find existing Code Freeze ruleset
      #
      # This runs every time so that:
      #
      #   - Freeze logic can check whether ruleset exists
      #   - Unfreeze logic can find the ruleset dynamically
      #
      # No ruleset ID is hardcoded.
      # ==========================================================
      - name: Find Code Freeze Ruleset
        id: find-freeze
        run: |
          echo "🔍 Searching for Code Freeze Protection ruleset..."

          RESPONSE=$(curl -s \
            -o /tmp/rulesets.json \
            -w "%{http_code}" \
            -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CODE_FREEZE_PAT }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/rulesets")

          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Failed to retrieve repository rulesets."
            cat /tmp/rulesets.json
            exit 1
          fi

          RULESET_ID=$(jq -r \
            '.[] | select(.name == "Code Freeze Protection") | .id' \
            /tmp/rulesets.json | head -n 1)

          if [ -n "$RULESET_ID" ]; then

            echo "🔒 Code Freeze Protection found."
            echo "Ruleset ID: $RULESET_ID"

            echo "ruleset_found=true" >> "$GITHUB_OUTPUT"
            echo "ruleset_id=$RULESET_ID" >> "$GITHUB_OUTPUT"

          else

            echo "ℹ️ No Code Freeze Protection ruleset found."

            echo "ruleset_found=false" >> "$GITHUB_OUTPUT"

          fi


      # ==========================================================
      # 4. Enable Code Freeze
      #
      # Create the ruleset only when:
      #
      #   - Freeze period is active
      #   - Ruleset does not already exist
      #
      # Release Manager:
      #   User ID 278897320
      #   PR-only bypass
      # ==========================================================
      - name: Enable Code Freeze
        if: steps.freeze-check.outputs.freeze == 'true' && steps.find-freeze.outputs.ruleset_found == 'false'
        run: |
          echo "🚨 Enabling Code Freeze..."

          RESPONSE=$(curl -s \
            -o /tmp/ruleset.json \
            -w "%{http_code}" \
            -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CODE_FREEZE_PAT }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/rulesets" \
            -d '{
              "name": "Code Freeze Protection",
              "target": "branch",
              "enforcement": "active",

              "bypass_actors": [
                {
                  "actor_id": 278897320,
                  "actor_type": "User",
                  "bypass_mode": "pull_request"
                }
              ],

              "conditions": {
                "ref_name": {
                  "include": [
                    "refs/heads/main"
                  ],
                  "exclude": []
                }
              },

              "rules": [
                {
                  "type": "update"
                }
              ]
            }')

          echo "HTTP Status: $RESPONSE"
          cat /tmp/ruleset.json

          if [ "$RESPONSE" = "201" ]; then

            echo "✅ Code Freeze Ruleset created successfully."
            echo "🔒 Repository is now under Code Freeze."

            # ==================================================
            # 4A. Create Code Freeze Notification
            # ==================================================

            echo "📢 Creating Code Freeze notification..."

            FREEZE_DATE="${{ steps.freeze-check.outputs.freeze_date }}"

            ISSUE_BODY=$(cat <<EOF
          ## 🚨 Code Freeze Started

          **Repository:** ${{ github.repository }}

          **Branch:** main

          **Release Date:** $RELEASE_DATE

          **Freeze Period:** $FREEZE_DAYS days

          **Freeze Date:** $FREEZE_DATE

          ---

          Code Freeze has been automatically enabled by GitHub Actions.

          ### During Code Freeze

          - Direct updates to \`main\` are blocked.
          - Developers should use Pull Requests.
          - Authorized Release Managers can use the configured PR bypass.

          **Workflow:** ${{ github.workflow }}

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

            ISSUE_PAYLOAD=$(jq -n \
              --arg title "🚨 Code Freeze Started" \
              --arg body "$ISSUE_BODY" \
              '{
                title: $title,
                body: $body
              }')

            ISSUE_RESPONSE=$(curl -s \
              -o /tmp/freeze-issue.json \
              -w "%{http_code}" \
              -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.CODE_FREEZE_PAT }}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d "$ISSUE_PAYLOAD")

            echo "Notification HTTP Status: $ISSUE_RESPONSE"
            cat /tmp/freeze-issue.json

            if [ "$ISSUE_RESPONSE" = "201" ]; then
              echo "✅ Code Freeze notification created successfully."
            else
              echo "⚠️ Failed to create Code Freeze notification."
              echo "Code Freeze itself was successfully enabled."
            fi

          else

            echo "❌ Failed to create Code Freeze Ruleset."
            exit 1

          fi


      # ==========================================================
      # 5. Disable Code Freeze
      #
      # Runs only when:
      #
      #   - Release is completed
      #   - Code Freeze ruleset exists
      #
      # Ruleset ID is discovered dynamically.
      # ==========================================================
      - name: Disable Code Freeze
        if: steps.release-check.outputs.release_completed == 'true' && steps.find-freeze.outputs.ruleset_found == 'true'
        run: |
          RULESET_ID="${{ steps.find-freeze.outputs.ruleset_id }}"

          echo "🔓 Disabling Code Freeze..."
          echo "Ruleset ID: $RULESET_ID"

          RESPONSE=$(curl -s \
            -o /tmp/delete-ruleset.json \
            -w "%{http_code}" \
            -L \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CODE_FREEZE_PAT }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/rulesets/$RULESET_ID")

          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" = "204" ]; then

            echo "✅ Code Freeze Ruleset deleted successfully."
            echo "🔓 Repository returned to normal development."

            # ==================================================
            # 5A. Create Code Freeze End Notification
            # ==================================================

            echo "📢 Creating Code Freeze end notification..."

            ISSUE_BODY=$(cat <<EOF
          ## 🔓 Code Freeze Ended

          **Repository:** ${{ github.repository }}

          **Branch:** main

          **Release Date:** $RELEASE_DATE

          ---

          The Code Freeze ruleset has been automatically removed.

          The repository has returned to normal development.

          **Workflow:** ${{ github.workflow }}

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )

            ISSUE_PAYLOAD=$(jq -n \
              --arg title "🔓 Code Freeze Ended" \
              --arg body "$ISSUE_BODY" \
              '{
                title: $title,
                body: $body
              }')

            ISSUE_RESPONSE=$(curl -s \
              -o /tmp/unfreeze-issue.json \
              -w "%{http_code}" \
              -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.CODE_FREEZE_PAT }}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d "$ISSUE_PAYLOAD")

            echo "Notification HTTP Status: $ISSUE_RESPONSE"
            cat /tmp/unfreeze-issue.json

            if [ "$ISSUE_RESPONSE" = "201" ]; then
              echo "✅ Code Freeze end notification created successfully."
            else
              echo "⚠️ Failed to create Code Freeze end notification."
              echo "Code Freeze itself was successfully removed."
            fi

          else

            echo "❌ Failed to delete Code Freeze Ruleset."
            cat /tmp/delete-ruleset.json
            exit 1

          fi